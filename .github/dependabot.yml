# Keeps the SHA-pinned GitHub Actions current.
#
# Every `uses:` in this repo is pinned to a commit SHA rather than a mutable
# tag, because Semgrep's github-actions-mutable-action-tag rule is blocking
# (the security-scan job runs `semgrep --error`). Pinning removes the supply
# chain risk but freezes the versions, so Dependabot owns bumping them and
# keeps the trailing `# vX.Y.Z` comment in sync.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    # Do not adopt a release the moment it appears. A freshly published
    # version is exactly the window a compromised release ships in, and
    # pinning by SHA buys nothing if the bump is automatic and instant.
    # Required by Semgrep's dependabot-missing-cooldown rule.
    cooldown:
      default-days: 7
      semver-major-days: 30

    # One PR for all actions, not one per action. Without this the first run
    # opened five separate PRs.
    groups:
      github-actions:
        patterns:
          - "*"

    # Major bumps of these actions carry breaking changes (upload-artifact v4
    # -> v7 changes artifact semantics) and must be adopted deliberately, with
    # the workflow reviewed. Minor and patch bumps keep the pins fresh.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

    commit-message:
      prefix: "chore(actions)"
