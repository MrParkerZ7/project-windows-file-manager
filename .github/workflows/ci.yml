name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      # Gate 1: Format check
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # Gate 2: Build with warnings as errors
      - name: Build
        # TreatWarningsAsErrors is already true in Directory.Build.props:6, so
        # passing it here as a global property was redundant — and being a global
        # property it made this step a different MSBuild build than the test step.
        # Removing it is a cleanup, NOT a fix for the intermittent coverage failure:
        # that reproduces locally with or without this flag (see ADR-005).
        run: dotnet build -c Release --no-restore

      # Gate 3: Test with coverage enforcement (100% line, branch, method)
      #
      # Do NOT add --no-build here. Coverage is enforced by coverlet.msbuild
      # (see docs/adr/ADR-005-coverage-enforcement-coverlet-msbuild.md), which
      # instruments the referenced assemblies during the build. With --no-build
      # those targets never run, so Core/Application report 0% and the 100%
      # threshold fails even though all 217 tests pass.
      #
      # --collect:"XPlat Code Coverage" is also absent deliberately: that data
      # collector ships in coverlet.collector, which this project does not
      # reference (only coverlet.msbuild). Asking for it logged
      # "Could not find data collector 'XPlat Code Coverage'" on every run.
      - name: Test with coverage
        run: dotnet test -c Release --no-restore

      # Gate 4: Dependency vulnerability audit
      - name: Dependency audit
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1
          Write-Output $output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable packages detected!"
            exit 1
          }
        shell: pwsh

      # Gate 5: Upload coverage report
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: tests/**/coverage/coverage.cobertura.xml
