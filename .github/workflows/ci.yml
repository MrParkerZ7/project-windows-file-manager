name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      # Gate 1: Format check
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # Gate 2: Build with warnings as errors
      - name: Build
        # TreatWarningsAsErrors is already true in Directory.Build.props:6, so
        # passing it here as a global property was redundant — and being a global
        # property it made this step a different MSBuild build than the test step.
        # Removing it is a cleanup, NOT a fix for the intermittent coverage failure:
        # that reproduces locally with or without this flag (see ADR-011).
        run: dotnet build -c Release --no-restore

      # Gate 3: Test with coverage enforcement (100% line, branch, method)
      #
      # Measurement is the XPlat Code Coverage data collector (coverlet.collector),
      # which instruments at RUNTIME. coverlet.msbuild instrumented at BUILD time and
      # raced: whole modules intermittently reported 0% while all 217 tests passed,
      # failing this gate in ~20-40% of runs. Measured across 6.0.2, 6.0.4 and 10.0.1
      # (20+ local trials) — no version fixed it.
      #
      # --no-build is safe again now: with no build-time instrumentation there is
      # nothing for a rebuild to overwrite.
      #
      # The collector cannot enforce a threshold, so Gate 3b does it.
      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/WindowsFileManager.Tests/coverlet.runsettings

      # Gate 3b: the threshold the collector cannot enforce itself
      - name: Coverage threshold
        run: ./scripts/Check-Coverage.ps1
        shell: pwsh

      # Gate 4: Dependency vulnerability audit
      - name: Dependency audit
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1
          Write-Output $output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable packages detected!"
            exit 1
          }
        shell: pwsh

      # Gate 5: Upload coverage report
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: tests/**/TestResults/**/coverage.cobertura.xml
